const grid = document.getElementById('toolsGrid');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const chipsBox = document.getElementById('categoryChips');
const emptyState = document.getElementById('emptyState');
const countLabel = document.getElementById('countLabel');
document.getElementById('totalCount').textContent = TOOLS.length;

let activeCategory = '全部';

function norm(s) { return (s || '').toLowerCase(); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function buildChips() {
    const cats = ['全部'].concat(Array.from(new Set(TOOLS.map(t => t.category))));
    chipsBox.innerHTML = '';
    cats.forEach(c => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (c === activeCategory ? ' active' : '');
        chip.textContent = c;
        chip.addEventListener('click', () => { activeCategory = c; buildChips(); render(); });
        chipsBox.appendChild(chip);
    });
}

function toolCardHTML(t) {
    const tags = (t.tags || []).map(tag => '<span class="tag">' + esc(tag) + '</span>').join('');
    return '<a class="tool-card" href="' + encodeURI(t.file) + '">'
        + '<div class="card-top"><div class="card-icon">' + t.icon + '</div><div class="card-name">' + esc(t.name) + '</div></div>'
        + '<p class="card-desc">' + esc(t.description) + '</p>'
        + '<div class="card-tags">' + tags + '</div>'
        + '<div class="card-bottom"><span class="card-category">' + esc(t.category) + '</span><span class="card-open">打开工具 &rarr;</span></div>'
        + '</a>';
}

function render() {
    const q = norm(searchInput.value.trim());
    const words = q ? q.split(/\s+/) : [];
    const matched = TOOLS.filter(t => {
        if (activeCategory !== '全部' && t.category !== activeCategory) return false;
        if (!words.length) return true;
        const hay = norm([t.name, t.description, t.category, (t.tags || []).join(' '), t.file].join(' '));
        return words.every(w => hay.includes(w));
    });

    let html = matched.map(toolCardHTML).join('');
    if (!q && activeCategory === '全部') {
        html += '<div class="tool-card add-card">'
            + '<div class="plus">+</div>'
            + '<div class="hint">新增工具<br>在本文件 <code>TOOLS</code> 数组中<br>追加一条记录即可</div>'
            + '</div>';
    }
    grid.innerHTML = html;

    emptyState.style.display = matched.length ? 'none' : 'block';
    countLabel.textContent = q || activeCategory !== '全部'
        ? '匹配 ' + matched.length + ' / ' + TOOLS.length + ' 个工具'
        : '共 ' + TOOLS.length + ' 个工具';
    clearBtn.style.display = q ? 'block' : 'none';
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchInput.value = ''; render(); searchInput.focus(); });

document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
    } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        render();
        searchInput.blur();
    }
});

buildChips();
render();
</script>
